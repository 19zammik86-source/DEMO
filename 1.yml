---
- name: Сбор и вывод информации о CPU и RAM
  hosts: hq-rtr,br-rtr,hq-srv,br-srv
  gather_facts: true

  tasks:
    - name: Вывод краткой информации в консоль
      ansible.builtin.debug:
        msg: |
          === Аппаратные параметры {{ inventory_hostname }} ===
          CPU: {{ ansible_processor_vcpus }} vCPU, модель {{ ansible_processor[2] if ansible_processor|length > 2 else 'N/A' }}
          RAM: {{ (ansible_memtotal_mb / 1024) | round(2) }} GB (Всего: {{ ansible_memtotal_mb }} MB)
